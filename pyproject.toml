[project]
name = "moe-sae"
version = "0.1.1"
description = "Router-Tied BatchTopK Sparse Autoencoders for Multimodal Mixture-of-Experts Models (frozen spec v0.1.1)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "accelerate>=1.14.0",
    "datasets>=5.0.0",
    "einops>=0.8.2",
    "jax>=0.4.35",
    "numpy>=2.4.6",
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
    "safetensors>=0.8.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "sentencepiece>=0.2.1",
    "timm>=1.0.27",
    "torch>=2.12.1",
    "torchvision",
    "tqdm>=4.68.3",
    "transformers==4.38.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moe_sae"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=8.0",
]
