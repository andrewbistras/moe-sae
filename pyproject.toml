[project]
name = "moe-sae"
version = "0.2.0"
description = "Router-conditioned sparse autoencoders for Gemma 4 MoE activations"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-crc32c==1.8.0",
    "jax>=0.8.0,<0.11",
    "numpy>=2.0",
    "pyyaml>=6.0",
    "safetensors>=0.5",
]

[project.optional-dependencies]
tpu = [
    "google-cloud-storage==3.13.0",
    "maxtext[tpu]==0.2.3",
    "orbax-checkpoint>=0.12.1,<0.13",
]
conversion = [
    "google-cloud-storage==3.13.0",
    "huggingface-hub==1.23.0",
    "maxtext[tpu]==0.2.3",
    "torch>=2.8",
]
data = [
    "array-record==0.8.3",
    "google-cloud-storage==3.13.0",
    "grain==0.2.18",
    "huggingface-hub==1.23.0",
    "transformers==5.13.1",
]

[project.scripts]
moe-sae = "moe_sae.cli:main"
moe-sae-contribution-training = "moe_sae.contribution_training_worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moe_sae"]

[tool.uv]
package = true

[tool.uv.sources]
# Experiment 2 needs the opt-in selected-output return in RoutedMoE.  The fork
# is a one-commit, manifest-verified child of the pinned upstream revision.
maxtext = { git = "https://github.com/andrewbistras/maxtext.git", rev = "73bafe53569eb17dc18542f2568dd591a8db9e28" }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# data.py remains byte-identical to the sealed capture producer so the
# fail-closed compatibility proof can retain its exact whole-file hash.
"src/moe_sae/data.py" = ["F401"]
# These boundaries deliberately catch arbitrary local failures so every TPU
# process enters the same collective error decision instead of stranding peers.
"src/moe_sae/audit_checkpoint.py" = ["BLE001", "TRY004"]
"src/moe_sae/gate1_audit.py" = ["BLE001"]
"src/moe_sae/gate1_distributed.py" = ["TRY004"]
