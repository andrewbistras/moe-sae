[project]
name = "moe-sae"
version = "0.2.0"
description = "Router-conditioned sparse autoencoders for Gemma 4 MoE activations"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jax>=0.8.0,<0.11",
    "numpy>=2.0",
    "pyyaml>=6.0",
    "safetensors>=0.5",
]

[project.optional-dependencies]
tpu = [
    "maxtext[tpu]==0.2.3",
    "orbax-checkpoint>=0.12.1,<0.13",
]
conversion = [
    "maxtext[tpu]==0.2.3",
    "torch>=2.8",
]

[project.scripts]
moe-sae = "moe_sae.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moe_sae"]

[tool.uv]
package = true

[tool.uv.sources]
maxtext = { git = "https://github.com/AI-Hypercomputer/maxtext.git", rev = "48c7da3e28e8f57fe36ddf09d00eec53072a2ea0" }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
