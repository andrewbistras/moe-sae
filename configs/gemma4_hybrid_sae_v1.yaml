  train_target_manifest_sha256: f29aaf45d9ff93be08cc3d175cdcea9fa4aecc37fc0e256d09720e88e1ae838c
  eval_target_manifest_sha256: 31454e5ce8693521c41a2a95f2ef88d40c5d26c726a0efac5c26d882ed341f5e
  train_source_overlay_manifest_sha256: null
  eval_source_overlay_manifest_sha256: null
