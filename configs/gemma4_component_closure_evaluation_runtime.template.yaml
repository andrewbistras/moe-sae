# Each resident bundle is pinned to one admitted training resource. SAE seeds
# stay on the two central1/v5 planes; transcoder seed0 stays on v5, seed1 on
# the on-demand v4, and seed2 on the spot v4.
assignments:
  sae.seed0: sae-v5-seed0
  sae.seed1: sae-v5-seed1
  sae.seed2: sae-v5-seed0
  transcoder.seed0: transcoder-v5-seed0
  transcoder.seed1: transcoder-v4-od-seed1
  transcoder.seed2: transcoder-v4-spot-seed2

resources:
  sae-v5-seed0:
    resource_id: sae-v5-seed0
    a_config_remote: /REMOTE/moe-sae/configs/gemma4_experiment5_routed_ladder_sae_v3.yaml
