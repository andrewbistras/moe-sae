schema_version: gemma4-contribution-transcoder-run-config-v1
protocol_id: gemma4-contribution-transcoder-v1-20260727
parent_protocol_id: gemma4-contribution-v1-20260725

provenance:
  model_id: google/gemma-4-26B-A4B
  model_revision: 24548b62aa021d562695c04aaf7758a1ea47990b
  maxtext_base_commit: 48c7da3e28e8f57fe36ddf09d00eec53072a2ea0
  maxtext_fork_commit: 73bafe53569eb17dc18542f2568dd591a8db9e28
  dataset_name: allenai/c4
  dataset_config: en
  dataset_revision: 1588ec454efa1a09f29cd18ddd04fe05fc8653a2
  train_split: train
  eval_split: validation

model:
  target_layer_one_indexed: 15
  hidden_size: 2816
  num_routed_experts: 128
  experts_per_token: 8
  sequence_length: 1024
  dtype: bfloat16
  use_multimodal: false
  scan_layers: false
  pure_nnx_decoder: true
  attention: autoselected
  dropout_rate: 0.0
  load_balance_loss_weight: 0.0

parents:
  target_schema_version: gemma4-expert-contribution-v2
  train_target_manifest_sha256: a2f23aef6b9121e81a5bfea473c64039ca5bf6b073e4f70f4703938a1d8a6903
  eval_target_manifest_sha256: 31454e5ce8693521c41a2a95f2ef88d40c5d26c726a0efac5c26d882ed341f5e
  train_tokens: 2000000
  eval_tokens: 250000
  recomposition_sidecar_schema_version: gemma4-contribution-recomposition-v1

source_overlay:
  schema_version: gemma4-routed-input-overlay-v1
  field: routed_input
  capture_site: target.mlp.pre_feedforward_layernorm_2(block15.post_attention_residual)
  dtype: bfloat16
  hidden_size: 2816
  max_shard_tokens: 16384
  statistics_dtype: float64
  alignment_fields:
    - sequence_id
    - position
  parent_binding: exact_target_manifest_and_logical_range
  mismatch_policy: hard_error

training:
  mode: contribution_transcoder
  seed: 0
  train_tokens: 2000000
  eval_tokens: 250000
  effective_batch_tokens: 16384
  microbatch_tokens: 4096
  planned_updates: 123
  warmup_updates: 12
  tail_mask_tokens: 15232
  source_centering: one_global_routed_input_mean
  target_centering: one_pooled_raw_expert_output_mean
  output_bias: none
  contribution_loss: normalized_router_weighted_sse
  router_weight_math_dtype: float32
  topk_requires_strictly_positive: true
  topk_tie_break: global_latent_id_ascending
  capacity_margin_fraction: 0.10
  capacity_overflow_policy: hard_error

execution:
  process_count: 4
  accelerator_min_useful_mfu: 0.10
  source_harvest_ungated_max_seconds: 600
  per_condition_max_seconds: 3600
  checkpoint_tokens:
    - 2000000

optimizer:
  parameter_dtype: bfloat16
  matmul_dtype: bfloat16
  moment_dtype: float32
  reduction_dtype: float32
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-8
  weight_decay: 0.0
  global_gradient_clip: 1.0
  peak_learning_rate: 0.0003
  minimum_learning_rate: 0.00003
  schedule: linear_warmup_cosine_decay
  decoder_init: unit_norm_columns
  encoder_init: decoder_transpose
  encoder_bias_init: zeros
  tangent_decoder_gradient_projection: true
  decoder_column_renormalization: true

layouts:
  - condition: A
    bank_identity: true_expert_id
    bank_count: 128
    bank_width: 256
    components_per_token: 8
    topk_per_component: 2
  - condition: R
    bank_identity: per_sequence_randomized_expert_id
    bank_count: 128
    bank_width: 256
    components_per_token: 8
    topk_per_component: 2
  - condition: B
    bank_identity: router_rank
    bank_count: 8
    bank_width: 256
    components_per_token: 8
    topk_per_component: 2
  - condition: F
    bank_identity: router_rank
    bank_count: 8
    bank_width: 4096
    components_per_token: 8
    topk_per_component: 2

evaluation:
  shared_branch: sealed_actual_oracle
  common_target_sst: true
  bootstrap_unit: packed_sequence
  bootstrap_replicates: 20000
  paired_confidence_level: 0.95
  primary_contrasts:
    - A-R
    - A-B
    - A-F
    - F-B
  minimum_g3_percent: 10.0
  undefined_denominator_policy: report_undefined
  effect_retention_reference:
    experiment2_a_minus_r: 0.2194296741
    experiment2_a_minus_b: 0.0216359968
